[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunamatch"
version = "0.1.0"
description = "Lunar image correspondence and registration research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10", "opencv-python-headless>=4.8,<5", "PyYAML>=6"]

[project.optional-dependencies]
planetary = ["rasterio>=1.3", "pds4-tools>=1.3"]
learned = ["torch>=2.3", "kornia>=0.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
test = ["pytest>=8"]

[project.scripts]
lunamatch = "lunamatch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
